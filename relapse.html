    // that case. Do one automatic recovery instead of making the user refresh
    // the browser manually. Never loop: after one recovery, leave the failure
    // visible so a genuine/non-transient error is not hidden.
    const transient = /ROP worker never answered|rop thread ran away|ROP-TIMEOUT|core: gave up after .*attempts|Reload\./i.test(message);
    if (!transient) return;

    let retries = 0;
    try { retries = parseInt(sessionStorage.getItem("relapse.auto-retry") || "0", 10) || 0; } catch (e) {}
    if (retries >= 1) {
        print("automatic retry already used; leaving the failure visible", "LOG-WARN");
        return;

    retries++;
    try { sessionStorage.setItem("relapse.auto-retry", String(retries)); } catch (e) {}
    print("transient exploit failure detected - automatic browser recovery 1/1...", "LOG-WARN");

const WKAL_INSTALLER = "wkal-installer.elf";
const WKAL_MANIFEST = "payloads/wkal-manifest.json";
